# FIPS node BUYER — Exp C over TCP.
#
# TEST IDENTITY ONLY. Same test identity as Exp C, different transport.

node:
  identity:
    nsec: "REPLACE_WITH_HEX_SEED"

tun:
  enabled: true
  name: fips0
  mtu: 1280

dns:
  enabled: true

transports:
  # No bind_addr: outbound-only. The buyer dials the seller.
  tcp: {}

peers:
  - npub: "npub16pdakpwe28famj7j392f5xkqxc35zhal4g3k2yna049wcxn58wjqsjm9wu"
    alias: "seller"
    addresses:
      - transport: tcp
        addr: "seller:443"
    connect_policy: auto_connect
