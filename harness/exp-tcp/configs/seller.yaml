# FIPS node SELLER — Exp C over TCP.
#
# TEST IDENTITY ONLY. Same test identity as Exp C, different transport.

node:
  identity:
    nsec: "REPLACE_WITH_HEX_SEED"

tun:
  enabled: true
  name: fips0
  mtu: 1280

dns:
  enabled: true

transports:
  tcp:
    bind_addr: "0.0.0.0:443"
    mtu: 1400

# Passive: buyer dials, seller's ACL gates admission.
peers: []
