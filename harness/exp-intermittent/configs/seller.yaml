# FIPS node SELLER — Exp C test topology.
#
# TEST IDENTITY ONLY. Derived from the test mesh name
# "low-layer-tollgate-exp-c" with the upstream derive_keys.py. Not a secret and
# not for production.

node:
  identity:
    nsec: "REPLACE_WITH_HEX_SEED"

tun:
  enabled: true
  name: fips0
  mtu: 1280

dns:
  enabled: true

transports:
  udp:
    bind_addr: "0.0.0.0:2121"
    mtu: 1472

# The seller is passive: it has no peer entry, so it never initiates. The
# buyer dials it, and the seller's peer ACL is the admission gate. (0.6.0-dev
# honours only auto_connect, so a peer entry would make the seller dial too and
# bypass its own inbound ACL.)
peers: []
