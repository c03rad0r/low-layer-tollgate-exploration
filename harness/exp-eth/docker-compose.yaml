name: low-layer-tollgate-exp-eth

services:
  a:
    image: ${FIPS_TEST_IMAGE:-fips-test:latest}
    container_name: lt-eth-a
    hostname: a
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls: ["net.ipv6.conf.all.disable_ipv6=0"]
    environment: [RUST_LOG=info]
    volumes: ["./configs/a.yaml:/etc/fips/fips.yaml:ro"]
    networks: [fips-l2]
    restart: "no"

  b:
    image: ${FIPS_TEST_IMAGE:-fips-test:latest}
    container_name: lt-eth-b
    hostname: b
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls: ["net.ipv6.conf.all.disable_ipv6=0"]
    environment: [RUST_LOG=info]
    volumes: ["./configs/b.yaml:/etc/fips/fips.yaml:ro"]
    networks: [fips-l2]
    restart: "no"

networks:
  fips-l2:
    driver: bridge
