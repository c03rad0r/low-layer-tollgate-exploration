# Exp MULTIPEER node B — the transit seller. A, C and D are its peers.
# TEST IDENTITY ONLY. Shared with the pause lab.
node:
  identity:
    nsec: "REPLACE_WITH_HEX_SEED"

tun:
  enabled: true
  name: fips0
  mtu: 1280

dns:
  enabled: true

transports:
